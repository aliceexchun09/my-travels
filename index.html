<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voyage Notes - 我的雲端旅行紀錄</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Firebase SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        :root {
            --bg-color: #FDFCFB;
            --primary-text: #4A4A4A;
            --accent-warm: #D0B8A8;
            --neutral-soft: #EAE0D5;
        }
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--primary-text);
            overflow-x: hidden;
        }
        .chart-wrapper {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: auto;
            height: 250px;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--neutral-soft); border-radius: 10px; }
        @keyframes dash { to { stroke-dashoffset: -20; } }
        .line-animation { animation: dash 3s linear infinite; }
        .map-container { background: white; border-radius: 40px; border: 1px solid #F0EAD6; overflow: hidden; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const COUNTRY_DATA = {
            "韓國": { x: 830, y: 180, distance: 1480 },
            "日本": { x: 860, y: 190, distance: 2100 },
            "英國": { x: 485, y: 115, distance: 9780 },
            "美國": { x: 200, y: 180, distance: 10500 },
            "法國": { x: 495, y: 140, distance: 9800 },
            "泰國": { x: 785, y: 280, distance: 2500 },
            "澳洲": { x: 850, y: 430, distance: 7200 },
            "新加坡": { x: 795, y: 320, distance: 3200 },
            "德國": { x: 510, y: 125, distance: 9300 },
            "義大利": { x: 520, y: 160, distance: 9600 },
            "越南": { x: 770, y: 310, distance: 1700 },
            "加拿大": { x: 220, y: 120, distance: 10000 },
        };
        const TAIWAN_COORD = { x: 815, y: 245 };

        // ✅ 已整合您的 Firebase 配置
        const myFirebaseConfig = {
            apiKey: "AIzaSyAq9EXi4VvhkL7SwkhA5SNPFvr__PtBxTc",
            authDomain: "voyage-note.firebaseapp.com",
            projectId: "voyage-note",
            storageBucket: "voyage-note.firebasestorage.app",
            messagingSenderId: "679162914418",
            appId: "1:679162914418:web:005446ce5f9fe9fe5244eb",
            measurementId: "G-P3HTY3S875"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(myFirebaseConfig);
        }

        const CanvasMap = ({ visitedCountries }) => {
            const canvasRef = useRef(null);
            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#EAE0D5'; ctx.globalAlpha = 0.2;
                [[220, 160, 110], [580, 130, 130], [840, 300, 90], [180, 350, 80]].forEach(([cx, cy, r]) => {
                    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
                });
                visitedCountries.forEach(country => {
                    const dest = COUNTRY_DATA[country] || { x: 500, y: 250 };
                    ctx.setLineDash([5, 5]); ctx.strokeStyle = '#D0B8A8'; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.8;
                    ctx.beginPath(); ctx.moveTo(TAIWAN_COORD.x, TAIWAN_COORD.y);
                    const cpX = (TAIWAN_COORD.x + dest.x) / 2;
                    const cpY = Math.min(TAIWAN_COORD.y, dest.y) - 70;
                    ctx.quadraticCurveTo(cpX, cpY, dest.x, dest.y); ctx.stroke();
                    ctx.setLineDash([]); ctx.fillStyle = '#4A4A4A'; ctx.beginPath(); ctx.arc(dest.x, dest.y, 4, 0, Math.PI * 2); ctx.fill();
                    ctx.font = '11px sans-serif'; ctx.fillStyle = '#9A8C98'; ctx.fillText(country, dest.x + 8, dest.y + 4);
                });
                ctx.globalAlpha = 1; ctx.fillStyle = '#2D2D2D'; ctx.beginPath(); ctx.arc(TAIWAN_COORD.x, TAIWAN_COORD.y, 6, 0, Math.PI * 2); ctx.fill();
                ctx.font = 'bold 13px sans-serif'; ctx.fillText('TAIWAN', TAIWAN_COORD.x - 22, TAIWAN_COORD.y + 22);
            }, [visitedCountries]);
            return <canvas ref={canvasRef} width={1000} height={500} className="w-full h-auto" />;
        };

        const CategoryChart = ({ data }) => {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);
            useEffect(() => {
                if (!chartRef.current || data.length === 0) return;
                if (chartInstance.current) chartInstance.current.destroy();
                const counts = data.reduce((acc, curr) => { acc[curr.category] = (acc[curr.category] || 0) + 1; return acc; }, {});
                const ctx = chartRef.current.getContext('2d');
                chartInstance.current = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: Object.keys(counts),
                        datasets: [{ data: Object.values(counts), backgroundColor: ['#D0B8A8', '#EAE0D5', '#9A8C98', '#4A4A4A'], borderWidth: 0 }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 11 } } } } }
                });
            }, [data]);
            return <div className="chart-wrapper"><canvas ref={chartRef}></canvas></div>;
        };

        const App = () => {
            const [view, setView] = useState('main');
            const [user, setUser] = useState(null);
            const [trips, setTrips] = useState([]);
            const [loading, setLoading] = useState(true);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [searchYear, setSearchYear] = useState('All');
            const [formData, setFormData] = useState({ location: '', country: '', startDate: '', endDate: '', note: '', category: '景點', image: null });

            useEffect(() => {
                const unsubscribe = firebase.auth().onAuthStateChanged(async (u) => {
                    if (u) { setUser(u); } else { try { await firebase.auth().signInAnonymously(); } catch(e) {} }
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsub = firebase.firestore().collection('users').doc(user.uid).collection('trips')
                    .onSnapshot((snap) => {
                        const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                        setTrips(data.sort((a, b) => new Date(b.startDate) - new Date(a.startDate)));
                        setLoading(false);
                    });
                return () => unsub();
            }, [user]);

            const visitedCountries = useMemo(() => [...new Set(trips.map(t => t.country))], [trips]);
            const totalKM = useMemo(() => trips.reduce((s, t) => s + (COUNTRY_DATA[t.country]?.distance || 0), 0), [trips]);
            const availableYears = useMemo(() => ['All', ...new Set(trips.map(t => new Date(t.startDate).getFullYear().toString()))].sort((a, b) => b - a), [trips]);
            const filteredTrips = trips.filter(t => searchYear === 'All' || new Date(t.startDate).getFullYear().toString() === searchYear);

            const handleImageChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => setFormData({...formData, image: reader.result});
                    reader.readAsDataURL(file);
                }
            };

            const handleSave = async (e) => {
                e.preventDefault();
                const id = Date.now().toString();
                try {
                    await firebase.firestore().collection('users').doc(user.uid).collection('trips').doc(id).set({ ...formData, id });
                    setIsModalOpen(false);
                    setFormData({ location: '', country: '', startDate: '', endDate: '', note: '', category: '景點', image: null });
                } catch (err) { alert("儲存失敗，請檢查規則設定。"); }
            };

            const handleDelete = async (id) => {
                if (window.confirm('確定要刪除這段記憶嗎？')) {
                    await firebase.firestore().collection('users').doc(user.uid).collection('trips').doc(id).delete();
                }
            };

            if (loading && trips.length === 0) return <div className="min-h-screen flex items-center justify-center"><div className="animate-spin rounded-full h-8 w-8 border-b-2 border-[#D0B8A8]"></div></div>;

            return (
                <div className="min-h-screen pb-20">
                    <nav className="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-[#F0EAD6] px-6 py-4 flex justify-between items-center">
                        <div className="flex items-center gap-2 cursor-pointer" onClick={() => setView('main')}>
                            <span className="text-2xl">🌍</span>
                            <h1 className="text-xl font-bold tracking-tight">Voyage Notes</h1>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={() => setView(view === 'map' ? 'main' : 'map')} className="text-xs font-bold text-[#9A8C98] px-3 py-2 border border-[#F0EAD6] rounded-full hover:bg-[#FAF9F6]">
                                {view === 'map' ? '← 返回清單' : '🗺️ 查看地圖'}
                            </button>
                            <button onClick={() => setIsModalOpen(true)} className="bg-[#2D2D2D] text-white px-5 py-2 rounded-full text-xs font-bold shadow-lg">＋ 新增紀錄</button>
                        </div>
                    </nav>

                    <main className="max-w-6xl mx-auto p-6 space-y-10">
                        {view === 'map' ? (
                            <section className="space-y-8 animate-in fade-in">
                                <div className="map-container p-4 shadow-sm"><CanvasMap visitedCountries={visitedCountries} /></div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="bg-white border border-[#F0EAD6] p-8 rounded-[32px] flex items-center gap-6">
                                        <div className="text-3xl">✈️</div>
                                        <div><p className="text-[10px] font-bold text-[#9A8C98] uppercase">累積里程</p><h3 className="text-3xl font-light">{totalKM.toLocaleString()} KM</h3></div>
                                    </div>
                                    <div className="bg-white border border-[#F0EAD6] p-8 rounded-[32px] flex items-center gap-6">
                                        <div className="text-3xl">🌏</div>
                                        <div><p className="text-[10px] font-bold text-[#9A8C98] uppercase">探險國家</p><h3 className="text-3xl font-light">{visitedCountries.length} 國</h3></div>
                                    </div>
                                </div>
                            </section>
                        ) : (
                            <>
                                <section className="flex flex-col md:flex-row justify-between items-end gap-6">
                                    <div className="space-y-2"><h2 className="text-3xl font-bold">我的旅行時光</h2><p className="text-[#9A8C98] text-sm">搜尋與回顧您的足跡</p></div>
                                    <div className="flex gap-2 bg-white p-1 rounded-full border border-[#F0EAD6]">
                                        {availableYears.map(y => (
                                            <button key={y} onClick={() => setSearchYear(y)} className={`px-4 py-1.5 rounded-full text-xs font-bold transition-all ${searchYear === y ? 'bg-[#2D2D2D] text-white' : 'text-[#9A8C98]'}`}>{y === 'All' ? '全部年份' : y}</button>
                                        ))}
                                    </div>
                                </section>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                    {filteredTrips.length > 0 ? filteredTrips.map(t => (
                                        <div key={t.id} className="bg-white border border-[#F0EAD6] rounded-[40px] overflow-hidden group hover:shadow-xl transition-all shadow-sm">
                                            <div className="h-56 bg-[#FAF9F6] relative overflow-hidden">
                                                {t.image ? <img src={t.image} className="w-full h-full object-cover group-hover:scale-105 transition-all duration-1000" /> : <div className="w-full h-full flex items-center justify-center text-4xl opacity-20">📸</div>}
                                                <div className="absolute top-4 left-4 bg-white/90 px-3 py-1 rounded-full text-[10px] font-bold">{t.category}</div>
                                                <button onClick={() => handleDelete(t.id)} className="absolute top-4 right-4 p-2 bg-white/80 rounded-full opacity-0 group-hover:opacity-100 text-red-300">✕</button>
                                            </div>
                                            <div className="p-8 space-y-3">
                                                <h4 className="text-xl font-bold">📍 {t.location}</h4>
                                                <p className="text-xs text-[#9A8C98] font-mono">{t.startDate} ⇢ {t.endDate}</p>
                                                <p className="text-sm italic text-[#6B705C] border-t border-[#FAF9F6] pt-4 line-clamp-3">「{t.note}」</p>
                                            </div>
                                        </div>
                                    )) : <div className="col-span-full py-32 text-center text-[#9A8C98]">目前沒有紀錄。</div>}
                                </div>
                                {trips.length > 0 && <section className="bg-white border border-[#F0EAD6] p-10 rounded-[48px] flex flex-col items-center"><CategoryChart data={trips} /></section>}
                            </>
                        )}
                    </main>

                    {isModalOpen && (
                        <div className="fixed inset-0 z-[60] bg-black/30 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white w-full max-w-lg rounded-[48px] p-10 space-y-6 shadow-2xl overflow-y-auto max-h-[90vh] custom-scrollbar">
                                <div className="flex justify-between items-center"><h2 className="text-2xl font-bold">封存回憶</h2><button onClick={() => setIsModalOpen(false)} className="text-2xl">✕</button></div>
                                <div className="space-y-4">
                                    <div className="h-40 bg-[#FAF9F6] rounded-3xl border-2 border-dashed border-[#F0EAD6] flex flex-col items-center justify-center overflow-hidden cursor-pointer" onClick={() => document.getElementById('photo-input').click()}>
                                        {formData.image ? <img src={formData.image} className="w-full h-full object-cover" /> : <div className="text-center text-[#9A8C98]"><div className="text-3xl">📷</div><p className="text-xs font-bold uppercase">上傳封面照</p></div>}
                                        <input id="photo-input" type="file" accept="image/*" className="hidden" onChange={handleImageChange} />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <input required placeholder="地點" className="w-full bg-[#FAF9F6] p-4 rounded-2xl outline-none" value={formData.location} onChange={e => setFormData({...formData, location: e.target.value})} />
                                        <input required placeholder="國家" className="w-full bg-[#FAF9F6] p-4 rounded-2xl outline-none" value={formData.country} onChange={e => setFormData({...formData, country: e.target.value})} />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <input type="date" className="bg-[#FAF9F6] p-4 rounded-2xl text-xs outline-none" value={formData.startDate} onChange={e => setFormData({...formData, startDate: e.target.value})} />
                                        <input type="date" className="bg-[#FAF9F6] p-4 rounded-2xl text-xs outline-none" value={formData.endDate} onChange={e => setFormData({...formData, endDate: e.target.value})} />
                                    </div>
                                    <select className="w-full bg-[#FAF9F6] p-4 rounded-2xl text-sm outline-none" value={formData.category} onChange={e => setFormData({...formData, category: e.target.value})}>
                                        <option value="景點">📸 景點參訪</option><option value="美食">🍜 美食饗宴</option><option value="購物">🛍️ 購物戰利品</option><option value="地標">🗼 城市地標</option>
                                    </select>
                                    <textarea placeholder="寫下心情..." className="w-full bg-[#FAF9F6] p-4 rounded-2xl h-24 text-sm outline-none resize-none" value={formData.note} onChange={e => setFormData({...formData, note: e.target.value})}></textarea>
                                </div>
                                <button onClick={handleSave} className="w-full bg-[#2D2D2D] text-white py-5 rounded-[24px] font-bold shadow-lg">同步至雲端</button>
                            </div>
                        </div>
                    )}
                    <footer className="py-20 text-center opacity-30 text-[10px] uppercase font-bold tracking-[0.4em]">Collect moments, not things.</footer>
                </div>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
